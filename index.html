<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATIFY</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="logo"><img src="/images/image.png"/>CATIFY</li>
            <li class="catify"></li>
            <div class="topbar">
                <div class="icon" id="home">
                    <img src="/images/home.png" alt="home" class="iconimg">
                </div>
                <div class="topsearch" id="topsearch">
                    <img src="/images/search.png" alt="search" class="searchicon">
                    |
                    <input type="text" id="search" placeholder="Search" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="none">
                </div>
                
                <div class="icon" id="user">
                    <img src="/images/user.png" alt="user" class="iconimg">
                </div>
                <div class="icon" id="colormode">
                    <img src="/images/dark_light_mode.png" alt="colormode" class="iconimg">
                </div>
            </div>
        </ul>
    </nav>
    <div class="container">
        
        <div class="playlists card">
            
        </div>
        <div class="songlist card">

        </div>
        <div class="banner card">
            
        </div>
    </div>
    <div class="player">
        <div class="playercard">
            <div class="playerimg">
                <img src="/images/cover.png" alt="cover" class="coverimg">
            </div>
        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
